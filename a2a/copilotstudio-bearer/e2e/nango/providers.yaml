copilot-a2a-lab:
  display_name: Copilot Studio A2A Lab Stand-in
  auth_mode: OAUTH2
  authorization_url: http://microsoft-login-stand-in:8080/authorize
  token_url: http://microsoft-login-stand-in:8080/token
  authorization_params:
    response_type: code
  token_params:
    grant_type: authorization_code
  refresh_params:
    grant_type: refresh_token
  proxy:
    base_url: http://copilot-a2a-stand-in:8080
  scopes:
    openid: openid
    offline_access: offline_access
    a2a: MCS.InvokeAsA2A
